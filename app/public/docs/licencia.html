<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licencia de Uso — Turnero</title>
<style>
    :root {
        --azul: #1a3a6e; --azul2: #2563eb; --gris: #64748b;
        --borde: #e2e8f0; --texto: #1e293b; --fondo: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--fondo); color: var(--texto);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.65; -webkit-text-size-adjust: 100%;
    }
    .barra {
        position: sticky; top: 0; z-index: 10;
        background: var(--azul); color: #fff;
        padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .barra h1 { margin: 0; font-size: 1rem; font-weight: 700; }
    .btn-print {
        background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
        border-radius: 7px; padding: 6px 14px; font-size: .82rem; font-weight: 600;
        cursor: pointer; font-family: inherit;
    }
    .btn-print:hover { background: rgba(255,255,255,.28); }
    .hoja {
        max-width: 820px; margin: 28px auto; background: #fff;
        border: 1px solid var(--borde); border-radius: 12px;
        padding: 48px 56px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .doc h1 { font-size: 1.7rem; color: var(--azul); margin: 0 0 .3em; line-height: 1.25; }
    .doc h2 { font-size: 1.15rem; color: var(--azul); margin: 1.8em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--borde); }
    .doc h3 { font-size: 1rem; color: var(--azul); margin: 1.4em 0 .4em; }
    .doc p { margin: .7em 0; }
    .doc ul, .doc ol { margin: .6em 0; padding-left: 1.5em; }
    .doc li { margin: .35em 0; }
    .doc strong { color: var(--azul); }
    .doc hr { border: none; border-top: 1px solid var(--borde); margin: 1.6em 0; }
    .doc em { color: var(--gris); }
    .cargando, .error { color: var(--gris); text-align: center; padding: 40px; }
    .error { color: #dc2626; }
    @media (max-width: 640px) { .hoja { padding: 28px 20px; margin: 16px 10px; } }
    @media print {
        .barra { display: none; }
        body { background: #fff; }
        .hoja { box-shadow: none; border: none; margin: 0; max-width: none; padding: 0; }
    }
</style>
</head>
<body>
    <div class="barra">
        <h1>Licencia de Uso</h1>
        <button class="btn-print" onclick="window.print()">Imprimir / PDF</button>
    </div>
    <div class="hoja">
        <div class="doc" id="doc"><div class="cargando">Cargando licencia…</div></div>
    </div>

<script>
// Renderizador Markdown mínimo (suficiente para este documento: títulos, listas,
// negrita, cursiva, separadores y párrafos). No usa librerías externas.
function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
    return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}
function renderMarkdown(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let parrafo = [];
    let lista = null;          // 'ul' | 'ol' | null
    let itemsLista = [];

    const cerrarParrafo = () => {
        if (parrafo.length) { html += '<p>' + inline(parrafo.join(' ')) + '</p>'; parrafo = []; }
    };
    const cerrarLista = () => {
        if (lista) { html += '<' + lista + '>' + itemsLista.join('') + '</' + lista + '>'; lista = null; itemsLista = []; }
    };
    const cerrarTodo = () => { cerrarParrafo(); cerrarLista(); };

    for (const raw of lines) {
        const line = raw.trimEnd();
        if (line.trim() === '') { cerrarTodo(); continue; }

        let m;
        if ((m = line.match(/^######\s+(.*)/))) { cerrarTodo(); html += '<h6>' + inline(m[1]) + '</h6>'; }
        else if ((m = line.match(/^###\s+(.*)/)))  { cerrarTodo(); html += '<h3>' + inline(m[1]) + '</h3>'; }
        else if ((m = line.match(/^##\s+(.*)/)))   { cerrarTodo(); html += '<h2>' + inline(m[1]) + '</h2>'; }
        else if ((m = line.match(/^#\s+(.*)/)))    { cerrarTodo(); html += '<h1>' + inline(m[1]) + '</h1>'; }
        else if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) { cerrarTodo(); html += '<hr>'; }
        else if ((m = line.match(/^\s*\d+\.\s+(.*)/))) {
            cerrarParrafo();
            if (lista !== 'ol') { cerrarLista(); lista = 'ol'; }
            itemsLista.push('<li>' + inline(m[1]) + '</li>');
        }
        else if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
            cerrarParrafo();
            if (lista !== 'ul') { cerrarLista(); lista = 'ul'; }
            itemsLista.push('<li>' + inline(m[1]) + '</li>');
        }
        else { cerrarLista(); parrafo.push(line.trim()); }
    }
    cerrarTodo();
    return html;
}

fetch('/docs/13_LICENCIA_DE_USO.md', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { document.getElementById('doc').innerHTML = renderMarkdown(md); })
    .catch(() => {
        document.getElementById('doc').innerHTML =
            '<div class="error">No se pudo cargar la licencia (13_LICENCIA_DE_USO.md).</div>';
    });
</script>
</body>
</html>
